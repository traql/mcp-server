name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      # DNS authentication, because the server namespace is io.traql rather than
      # io.github.traql. The private key pairs with the TXT record on traql.io.
      - name: Publish to MCP Registry
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          ./mcp-publisher login dns --domain traql.io --private-key "$MCP_DNS_PRIVATE_KEY"
          ./mcp-publisher publish
