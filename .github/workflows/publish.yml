name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm trusted publishing — the registry verifies this run
      # against the publisher configured on the package, so no npm credential
      # is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+, newer than the npm bundled with
      # Node 22.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Both publishes are skipped when the version is already out, so a tag can
      # be pushed after a manual release without failing the run.
      # No NODE_AUTH_TOKEN: authentication is the OIDC token above. npm also
      # attaches build provenance automatically on a trusted publish.
      - name: Publish to npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "@traql/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@traql/mcp@$VERSION is already on npm, skipping"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      # DNS authentication, because the server namespace is io.traql rather than
      # io.github.traql. The private key pairs with the TXT record on traql.io.
      - name: Publish to MCP Registry
        env:
          MCP_DNS_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          PUBLISHED=$(curl -sf "https://registry.modelcontextprotocol.io/v0/servers?search=io.traql/mcp-server" \
            | python3 -c "import json,sys; print(any(s.get('server',s).get('version')=='$VERSION' for s in json.load(sys.stdin).get('servers',[])))")
          if [ "$PUBLISHED" = "True" ]; then
            echo "io.traql/mcp-server $VERSION is already in the registry, skipping"
          else
            ./mcp-publisher login dns --domain traql.io --private-key "$MCP_DNS_PRIVATE_KEY"
            ./mcp-publisher publish
          fi
